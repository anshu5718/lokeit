name: 🖥 Daily LokIT PSC Vacancy Scraper

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies for Puppeteer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libnss3 libxss1 libasound2t64

      - name: Install npm packages
        run: cd scraper && npm install

      - name: Run vacancy scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: cd scraper && node scrape.js

            - name: Commit updated vacancies
        run: |
          git config --global user.name "LokIT Bot 🤖"
          git config --global user.email "lokit-bot@users.noreply.github.com"

          # Stash scraper changes temporarily
          git stash push --include-untracked

          # Get latest remote changes
          git pull --rebase origin main

          # Restore scraper changes
          git stash pop || true

          git add public/vacancies.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🔄 Update IT vacancies — $(date +'%Y-%m-%d')"

          git push origin main
      - name: Trigger Netlify deploy
        if: env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: curl -s -X POST "$NETLIFY_BUILD_HOOK"
