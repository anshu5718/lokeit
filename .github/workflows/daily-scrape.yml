name: 🖥 Daily LokIT PSC Vacancy Scraper

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install system dependencies for Puppeteer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libnss3 \
            libxss1 \
            libasound2t64

      - name: Install npm dependencies
        run: cd scraper && npm ci

      - name: Run vacancy scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PUPPETEER_SKIP_DOWNLOAD: false
        run: cd scraper && node scrape.js

      - name: Commit and sync changes safely
        run: |
          git config --global user.name "LokIT Bot 🤖"
          git config --global user.email "lokit-bot@users.noreply.github.com"

          # Stage all changes (more robust than targeting single file)
          git add -A

          # Exit if nothing changed
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🔄 Update IT vacancies — $(date +'%Y-%m-%d')"

          echo "Syncing with remote..."

          # CRITICAL FIX: handles dirty state + remote updates safely
          git pull --rebase --autostash origin main

          echo "Pushing changes..."
          git push origin main

      - name: Trigger Netlify deploy
        if: env.NETLIFY_BUILD_HOOK != ''
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: curl -s -X POST "$NETLIFY_BUILD_HOOK"
