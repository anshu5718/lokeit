[build]
  publish = "public"

# No build command needed — it's a pure static site.
# The scraper runs on GitHub Actions and commits vacancies.json,
# which Netlify auto-deploys via the GitHub integration.

[[headers]]
  for = "/vacancies.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
